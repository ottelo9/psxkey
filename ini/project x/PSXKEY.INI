; Project X - boot: restart_in_ms-dos_mode.pif, menu 4 (EM)
; needs EMS (EMM386 RAM), else 'Insuff. memory free'
; timer = rtc is required: the game takes over the system timer (INT 8)
[psx]
port = auto
timer = rtc
box = ctrl
cross = space
circle = tab
triangle = m
select = p
start = esc
l1 = 1
l2 = alt
r1 = 3
r2 = 4
up = up
down = down
left = left
right = right
