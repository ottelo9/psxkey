; Super Street Fighter II Turbo - boot: restart_in_ms-dos_mode.pif, menu 8 (X)
; timer = rtc is required: the game takes over the system timer (INT 8)
; player 1 default keys; start = pause, select = Alt+X (quit current fight)
[psx]
port = auto
timer = rtc
up = w
down = s
left = a
right = d
; punches: jab, strong, fierce
box = t
triangle = y
r1 = u
; kicks: short, forward, roundhouse
cross = g
circle = h
r2 = j
start = pause
select = alt+x
