; The Lion King (DOS/4GW) - boot: restart_in_ms-dos_mode.pif, menu 5 (XM)
; timer = rtc is required: the game takes over the system timer (INT 8)
[psx]
port = auto
timer = rtc
box = alt
cross = space
circle = ctrl
triangle = return
select = p
start = esc
l1 = shift
l2 = alt
r1 = left
r2 = shift
up = up
down = down
left = left
right = right
